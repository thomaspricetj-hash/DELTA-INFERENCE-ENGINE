[package]
name = "delta_inference"
version = "0.1.0"
edition = "2021"
authors = ["Thomas Price <you@your.email>"]
description = "Delta‑Inference Engine core: f32/bf16 delta compute and KV‑cache delta layer"
repository = "https://github.com/thomaspricetj-hash/TokenStoreDelta"
readme = "README.md"
license = "Proprietary"

[lib]
name = "delta_inference"
crate-type = ["rlib", "cdylib"]

[dependencies]
ndarray = { version = "0.15", features = ["blas"] }
rayon = { version = "1.7", optional = true }
ahash = "0.8"
bytes = "1.4"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
half = "2.7.1"
bytemuck = "1.13"

# Optional Python bindings (enable via feature)
pyo3 = { version = "0.19", features = ["extension-module", "auto-initialize"], optional = true }

[features]
default = ["parallel"]
parallel = ["rayon"]
python = ["pyo3"]

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

